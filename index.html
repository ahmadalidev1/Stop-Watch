<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Stopwatch Project</title>
    <link rel="stylesheet" href="./link.css">
</head>
<body>
    <div class="stopwatch-container">
        <h1>STOP WATCH</h1>

        <div class="circle">
            <div class="inner-circle"></div>
            <div class="display para">00:00:00</div>
        </div>

        <div class="btns">
            <button class="start"><i class="fa-solid fa-play"></i></button>
            <button class="pause"><i class="fa-solid fa-pause"></i></button>
            <button class="reset"><i class="fa-solid fa-arrow-rotate-left"></i></button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
